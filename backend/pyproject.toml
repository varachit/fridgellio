[project]
name = "fridgellio-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.165,<1",
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "pillow>=12,<14",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "starlette",
    "structlog>=25,<27",
    "uvicorn>=0.34,<1",
    "zxing-cpp>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
